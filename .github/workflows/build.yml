name: build
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t dynldr-build docker
      - name: build everything that needs no toolkit (loader, login, authhelper, hdiutil, Metal)
        run: |
          docker run --rm -v "$PWD:/w:ro" dynldr-build sh -c '
            H="-g -O2 -fstack-protector-strong -fstack-clash-protection -fcf-protection -D_FORTIFY_SOURCE=2 -Wdate-time"
            cmake -S /w -B /tmp/b -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_FLAGS="$H" -DCMAKE_CXX_FLAGS="$H" \
              -DCMAKE_EXE_LINKER_FLAGS=-Wl,-z,relro && ninja -C /tmp/b && ls -l /tmp/b'
